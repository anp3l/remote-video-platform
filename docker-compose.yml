version: '3.8'

services:
  # ============================================================
  # SHARED MONGODB
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: video-platform-db
    restart: unless-stopped
    # Differing port to avoid conflicts with local MongoDB installations
    ports:
      - "27020:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - video-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================
  # AUTH SERVICE (Identity Provider - Port 4000)
  # ============================================================
  auth-service:
    build:
      context: https://github.com/anp3l/auth-server.git#main
    container_name: auth-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - PORT=4000
      - MONGO_URI=mongodb://mongodb:27017/authdb
      - PRIVATE_KEY_BASE64=${PRIVATE_KEY_BASE64}
      - PUBLIC_KEY_BASE64=${PUBLIC_KEY_BASE64}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - video-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ============================================================
  # VIDEO SERVICE (Resource Server - Port 3070)
  # ============================================================
  video-service:
    build:
      context: https://github.com/anp3l/remote-video-server.git#main
    container_name: video-server
    restart: unless-stopped
    ports:
      - "3070:3070"
    env_file:
      - .env
    environment:
      - PORT=3070
      - MONGO_URI=mongodb://mongodb:27017/videoLibrary
      - PUBLIC_KEY_BASE64=${PUBLIC_KEY_BASE64}
      - STREAM_SECRET=${STREAM_SECRET}
    volumes:
      - video-uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - video-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - label:disable

  # ============================================================
  # FRONTEND CLIENT (Angular - Port 4200)
  # ============================================================
  client:
    build:
      context: https://github.com/anp3l/remote-video-client.git#main
    container_name: video-client
    restart: unless-stopped
    ports:
      - "4200:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      video-service:
        condition: service_healthy
    networks:
      - video-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

# ============================================================
# NETWORKS & VOLUMES
# ============================================================
networks:
  video-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  video-uploads:
    driver: local
